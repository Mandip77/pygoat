name: DevSecOps Automated CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast_and_audit:
    name: Run SAST & Dependency Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit & Pip-Audit
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Software Composition Analysis (pip-audit)
        run: |
          echo "=== Scanning Dependencies for Known CVEs ==="
          pip-audit -r requirements.txt || true

      - name: Static Application Security Testing (Bandit)
        run: |
          echo "=== Running Bandit SAST on Django App ==="
          bandit -r . -f custom --msg-template "{abspath}:{line}: [{test_id}] {severity}: {msg}" -ll || true
          bandit -r . -f json -o bandit-findings.json || true

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-findings
          path: bandit-findings.json

  codeql_deep_scan:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
